<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C24A30">
<title>Bingo du Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@500;600&display=swap">
<style>
/* Layout: une piste d'athlé en fond, un dossard au centre qui porte les 5 objets, un gros bouton en dessous */
:root{
  --track:#C24A30;
  --track-deep:#A23B24;
  --lane:#F3E9DC;
  --bib:#FBFAF6;
  --ink:#17161A;
  --muted:#6E6A66;
  --blue:#1E4CC4;
  --found:#1E8F4E;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
  --label:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 3px), var(--lane) calc(25% - 3px) 25%),
    var(--track);
  background-color:var(--track);
  color:var(--ink);
  font-family:var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
}
body::after{ /* grain du tartan */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.2px);
  background-size:5px 5px;
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}

.bib{
  background:var(--bib);
  border-radius:10px;
  position:relative;
  padding:18px 22px 20px;
  box-shadow:0 2px 0 var(--track-deep), 0 18px 40px rgba(60,10,0,.35);
  transform:rotate(-1.2deg);
}
.pin{position:absolute;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff 0 20%, #b9b4ad 45%, #6c6863 100%);
  box-shadow:inset 0 0 0 2px var(--bib), 0 0 0 1.5px #8b867f}
.pin.tl{top:10px;left:10px}.pin.tr{top:10px;right:10px}
.pin.bl{bottom:10px;left:10px}.pin.br{bottom:10px;right:10px}

.band{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  font-size:.82rem;color:var(--blue);padding-inline:12px;
}
h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.6rem, 13vw, 3.6rem);line-height:.95;
  margin:8px 0 0;text-align:center;letter-spacing:.01em;text-transform:uppercase;
  text-wrap:balance;
}
h1 span{color:var(--blue)}
.num{
  font-family:var(--display);font-size:clamp(3.4rem, 18vw, 5rem);line-height:1;
  text-align:center;color:var(--ink);margin:6px 0 2px;
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
}
.sub{text-align:center;font-family:var(--label);font-weight:500;color:var(--muted);
  font-size:.95rem;letter-spacing:.04em;margin:0 0 14px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{
  display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:10px;
  min-height:52px;padding:8px 12px;border-radius:8px;
  border:2px dashed #d9d2c8;background:transparent;width:100%;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  transition:background .2s, border-color .2s, transform .15s;
}
.item:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.item.filled{border-style:solid;border-color:var(--ink);background:#fff}
.item .idx{font-family:var(--display);font-size:1.5rem;color:var(--blue);text-align:center;font-variant-numeric:tabular-nums}
.item .txt{font-family:var(--label);font-weight:700;font-size:1.25rem;line-height:1.1;text-transform:uppercase;letter-spacing:.01em;min-width:0;overflow-wrap:anywhere}
.item.empty .txt{color:#b8b0a6}
.item .box{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.item.empty .box{border-color:#d9d2c8}
.item.found{background:#E7F4EC;border-color:var(--found)}
.item.found .txt{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--found)}
.item.found .box{background:var(--found);border-color:var(--found)}
.item.found .box::after{content:"";width:9px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.item.spin .txt{color:var(--muted)}
.item.pop{animation:pop .35s ease-out both}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

.foot{display:flex;justify-content:space-between;margin-top:14px;padding-inline:12px;
  font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted)}
.foot b{color:var(--ink);font-variant-numeric:tabular-nums}

.go{
  appearance:none;border:0;cursor:pointer;
  font-family:var(--display);font-size:clamp(1.7rem, 8vw, 2.2rem);letter-spacing:.04em;text-transform:uppercase;
  background:var(--ink);color:var(--bib);
  padding:20px 16px;border-radius:999px;width:100%;
  box-shadow:0 7px 0 #000, 0 14px 26px rgba(0,0,0,.35);
  transition:transform .08s, box-shadow .08s;
}
.go:active{transform:translateY(6px);box-shadow:0 1px 0 #000, 0 6px 14px rgba(0,0,0,.3)}
.go:focus-visible{outline:4px solid var(--bib);outline-offset:4px}
.go:disabled{opacity:.85;cursor:wait}
.hint{color:var(--lane);text-align:center;font-family:var(--label);font-weight:500;font-size:1rem;letter-spacing:.03em;margin:-6px 0 0}

.credit{color:var(--lane);text-align:center;font-family:var(--label);font-weight:500;font-size:.95rem;letter-spacing:.03em;margin:0;opacity:.9}
.credit b{font-family:var(--display);font-weight:400;letter-spacing:.06em;font-size:1.1rem;color:var(--bib)}
.bingo{
  position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5;
}
.bingo span{
  font-family:var(--display);font-size:clamp(4rem, 26vw, 9rem);color:var(--bib);
  text-shadow:0 6px 0 var(--blue), 0 12px 30px rgba(0,0,0,.4);
  transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

@media (prefers-reduced-motion: reduce){
  .item.pop,.bingo span{animation:none}
}
</style>
</head>
<body>

<div class="wrap">
  <article class="bib" aria-labelledby="t">
    <i class="pin tl"></i><i class="pin tr"></i><i class="pin bl"></i><i class="pin br"></i>
    <div class="band"><span>OSKOUR</span><span id="date"></span></div>
    <h1 id="t">Bingo <span>du run</span></h1>
    <div class="num" id="num">000</div>
    <p class="sub">5 objets à trouver avant la fin du run</p>
    <ol class="list" id="list"></ol>
    <div class="foot"><span>Trouvés <b id="score">0/5</b></span><span><b id="count">0</b> objets possibles</span></div>
  </article>

  <button class="go" id="go" type="button">Tirer 5 objets</button>
  <p class="hint">Pendant le run, touche un objet pour le cocher.</p>
  <p class="credit">Un défi lancé par <b>OSKOUR</b> sur TikTok. Fais ton bingo et montre-le en vidéo.</p>
</div>
<div class="bingo" id="bingo" hidden><span>BINGO!</span></div>

<script>
const BASE = `un chien|un chat|un pigeon|un corbeau|un merle|une pie|un canard|un oiseau sur un fil électrique|un oiseau sur un toit|un chien en laisse|un tout petit chien|un gros chien|un chien noir|un chien blanc|un chien marron|un chat sur un mur|un chat derrière une fenêtre|un chien qui aboie|deux chiens ensemble|une crotte de chien|un escargot|une limace|un ver de terre|une toile d'araignée|un autre coureur|un cycliste|quelqu'un qui promène son chien|une poussette|quelqu'un avec un bonnet|quelqu'un au téléphone|quelqu'un avec une capuche|quelqu'un avec des écouteurs|un enfant|une personne âgée|quelqu'un sur un banc|quelqu'un qui attend le bus|quelqu'un avec un sac à dos|quelqu'un avec un sac de courses|quelqu'un en trottinette|un livreur|une voiture de La Poste|quelqu'un qui fume|quelqu'un en jogging|quelqu'un avec un parapluie|quelqu'un qui te dit bonjour|un couple|un groupe de jeunes|quelqu'un avec une casquette|quelqu'un avec des lunettes|quelqu'un en vélo électrique|quelqu'un qui sort sa poubelle|quelqu'un qui rentre chez lui|quelqu'un avec une baguette|un parent avec son enfant|quelqu'un en voiture à l'arrêt|quelqu'un qui marche vite|quelqu'un qui te regarde courir|un bus|un camion|une camionnette blanche|une moto|un scooter|un vélo|un vélo garé|une voiture garée sur le trottoir|un tracteur|une voiture électrique|un camion poubelle|un camion de livraison|une voiture sale|une voiture toute neuve|un 4x4|une voiture qui fait un créneau|une voiture avec un chien dedans|une voiture avec des enfants dedans|une trottinette électrique|une voiture qui clignote|une voiture avec les phares allumés|une voiture avec un autocollant|une voiture à l'arrêt moteur allumé|une remorque|une voiture break|un feu rouge|un feu vert|un passage piéton|un rond-point|un panneau stop|un panneau sens interdit|un panneau 30|un panneau 50|un panneau de nom de rue|un panneau de ville|un panneau parking|un panneau d'interdiction de stationner|un panneau de priorité|un panneau cédez le passage|une boîte aux lettres jaune de La Poste|un lampadaire|un banc|une poubelle publique|un container à verre|une plaque d'égout|un arrêt de bus|un abribus|une église|une boulangerie|une pharmacie|un bar|un café|un bureau de tabac|un supermarché|une école|une mairie|un parking|une place handicapée|un caniveau|une bouche d'incendie|un poteau|un panneau publicitaire|une affiche|un tag|un graffiti|un sticker sur un poteau|une flèche peinte au sol|une ligne blanche|un ralentisseur|un cône orange|un panneau travaux|une barrière|une grille|une clôture|un portail|une haie|un mur en briques|une maison en briques rouges|un garage|une porte de garage|une fenêtre ouverte|des volets fermés|des volets ouverts|un balcon|une cheminée|une antenne sur un toit|une parabole|une gouttière|une boîte aux lettres|une sonnette|un paillasson|des pots de fleurs|un jardin|une pelouse|des poubelles sorties|un bac de tri jaune|un vélo attaché|une caméra de surveillance|un pont|un escalier|un parc|une aire de jeux|un terrain de foot|un panier de basket|un chantier|une grue|un tas de sable|un rideau à une fenêtre|une lumière allumée dans une maison|une décoration de Noël|un sapin|une guirlande lumineuse|une plante sur un rebord de fenêtre|un drapeau français|une plaque de rue bleue|un compteur électrique|une boîte aux lettres pleine de pubs|un trottoir abîmé|un trou dans la route|des pavés|un chemin de terre|une piste cyclable|un arbre|un grand arbre|un arbre sans feuilles|un tas de feuilles mortes|une feuille jaune|une feuille rouge|une flaque d'eau|de la boue|un buisson|des fleurs|une fleur jaune|une fleur blanche|de la mousse|du lierre sur un mur|un champ|un nuage|le soleil|une branche par terre|un caillou|un bâton|une pomme de pin|un gland|un marron|un pissenlit|une pâquerette|de l'herbe haute|une flaque avec un reflet|un mégot|une canette|une bouteille en plastique|un papier par terre|un ticket de caisse|un masque par terre|un emballage de bonbon|un chewing-gum collé au sol|un bouchon|un sac plastique|un carton|une plume|une capsule de bouteille|un prospectus|entendre un oiseau chanter|entendre un chien aboyer|entendre un klaxon|entendre une cloche|entendre une sirène|entendre une moto|entendre des enfants|entendre de la musique|entendre un avion|sentir une odeur de cuisine|sentir une odeur de pain|voir un avion dans le ciel|voir ton ombre|voir ton reflet dans une vitre|un banc mouillé|une flèche de direction|un panneau de rue avec un prénom`.split("|");
const fem = ["rouge","bleue","blanche","noire","grise","verte","jaune","orange","marron","beige","bordeaux","bleu foncé"];
const masc = ["rouge","bleu","blanc","noir","gris","vert","jaune","orange","marron","rose","violet"];
const L = [];
fem.forEach(c => L.push("une voiture " + c));
["rouge","bleue","blanche","noire","grise","verte","jaune","marron","en bois"].forEach(c => L.push("une porte " + c));
["blancs","bleus","verts","marron","gris","en bois"].forEach(c => L.push("des volets " + c));
masc.forEach(c => L.push("quelque chose de " + c));
["noir","gris","bleu","rouge","vert","blanc","beige","kaki"].forEach(c => L.push("quelqu'un avec un manteau " + c));
["noir","gris","rouge","bleu","blanc","jaune","vert","rose"].forEach(c => L.push("quelqu'un avec un bonnet " + c));
["blanches","noires","grises","rouges","bleues","fluo"].forEach(c => L.push("quelqu'un avec des baskets " + c));
["rouge","bleu","noir","blanc","vert"].forEach(c => L.push("un vélo " + c));
["blanche","noire","verte","grise","marron"].forEach(c => L.push("une boîte aux lettres " + c));
["Renault","Peugeot","Citroën","Volkswagen","Toyota","Dacia","BMW","Mercedes","Audi","Ford","Fiat","Opel","Kia","Hyundai","Nissan","Skoda","Seat"].forEach(m => L.push("une " + m));
for (let n = 0; n <= 9; n++) L.push("une plaque d'immatriculation avec un " + n);
"ABCDEFGHJKLMNPQRSTVWXYZ".split("").forEach(l => L.push("une plaque qui commence par " + l));
for (let n = 1; n <= 40; n++) L.push("le numéro " + n + " sur une maison");
["rue de la Gare","rue de l'Église","rue du Moulin","rue Victor Hugo","rue Jean Jaurès","rue Pasteur","rue de la République","place de la Mairie","rue des Écoles","rue du Général de Gaulle","rue Jules Ferry","rue de Paris","rue Gambetta","rue Voltaire","rue de la Paix","une rue avec un nom de fleur","une rue avec un nom d'arbre","une rue avec un nom de ville"].forEach(r => L.push(r.startsWith("une") ? r : "le panneau « " + r + " »"));
["SORTIE","PRIVÉ","OUVERT","FERMÉ","PROMO","PARKING","ÉCOLE","PIZZA","TABAC","BAR","BIENVENUE","ATTENTION","INTERDIT","BOULANGERIE","GARAGE","À VENDRE","À LOUER","LIVRAISON","SERVICE","ACCUEIL"].forEach(w => L.push("le mot « " + w + " » écrit quelque part"));
const ITEMS = [...new Set(BASE.concat(L).map(s => s.trim()).filter(Boolean))];

const $ = id => document.getElementById(id);
const list = $("list"), go = $("go"), num = $("num"), score = $("score"), bingo = $("bingo");
$("count").textContent = ITEMS.length;
$("date").textContent = new Date().toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"});
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let state = {picks: [], found: [], bib: null};
try { const s = JSON.parse(localStorage.getItem("bingo-run")); if (s && s.picks && s.picks.length === 5) state = s; } catch(e) {}
const save = () => { try { localStorage.setItem("bingo-run", JSON.stringify(state)); } catch(e) {} };

function pick5(){
  const pool = ITEMS.slice(), out = [];
  for (let i = 0; i < 5; i++) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return out;
}
const rnd = () => ITEMS[Math.floor(Math.random() * ITEMS.length)];
const bibNum = () => String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");

function render(){
  list.innerHTML = "";
  for (let i = 0; i < 5; i++){
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.id = "item-" + i;
    const has = !!state.picks[i];
    b.className = "item " + (has ? "filled" : "empty") + (state.found[i] ? " found" : "");
    b.innerHTML = `<span class="idx">${i+1}</span><span class="txt"></span><span class="box"></span>`;
    b.querySelector(".txt").textContent = has ? state.picks[i] : "? ? ?";
    b.setAttribute("aria-pressed", state.found[i] ? "true" : "false");
    b.disabled = !has;
    b.addEventListener("click", () => toggle(i));
    li.appendChild(b); list.appendChild(li);
  }
  num.textContent = state.bib || "000";
  updateScore();
}
function updateScore(){
  const n = state.found.filter(Boolean).length;
  score.textContent = n + "/5";
  return n;
}
function toggle(i){
  if (!state.picks[i]) return;
  state.found[i] = !state.found[i];
  const b = $("item-" + i);
  b.classList.toggle("found", state.found[i]);
  b.setAttribute("aria-pressed", state.found[i] ? "true" : "false");
  save();
  if (updateScore() === 5 && state.found[i]) showBingo();
}
function showBingo(){
  bingo.hidden = false;
  clearTimeout(showBingo.t);
  showBingo.t = setTimeout(() => { bingo.hidden = true; }, 2500);
}

function draw(){
  const final = pick5(), finalBib = bibNum();
  state = {picks: [], found: [false,false,false,false,false], bib: null};
  go.disabled = true;
  render();
  const btns = [...list.querySelectorAll(".item")];
  btns.forEach(b => { b.classList.remove("empty"); b.classList.add("filled","spin"); });
  if (reduce){
    state = {picks: final, found: [false,false,false,false,false], bib: finalBib};
    save(); render(); go.disabled = false; return;
  }
  const start = performance.now();
  const stopAt = [700, 950, 1200, 1450, 1700];
  let done = 0;
  (function tick(now){
    const t = now - start;
    num.textContent = t < 1700 ? bibNum() : finalBib;
    btns.forEach((b, i) => {
      if (b.dataset.locked) return;
      if (t >= stopAt[i]){
        b.dataset.locked = "1";
        b.classList.remove("spin"); b.classList.add("pop");
        b.querySelector(".txt").textContent = final[i];
        done++;
      } else {
        b.querySelector(".txt").textContent = rnd();
      }
    });
    if (done < 5) requestAnimationFrame(tick);
    else {
      state = {picks: final, found: [false,false,false,false,false], bib: finalBib};
      save(); render(); go.disabled = false;
      go.textContent = "Relancer";
    }
  })(start);
}

go.addEventListener("click", draw);
render();
if (state.picks.length === 5) go.textContent = "Relancer";
</script>

</body>
</html>
